# Old Jekyll URLs kept alive after the move to Next.js. Each entry becomes a
# static redirect page in public/, written by scripts/generate-redirects.ts.
#
# from: the old path. A path without an extension is written as <path>.html,
#   which GitHub Pages serves at the extensionless URL.
# post: a post slug. Gets a canonical link and the post's OG tags.
# page: an internal path. Gets a canonical link.
# link: an external URL. Gets noindex.
#
# Adding an entry also needs a matching line in .gitignore.

# Posts
- from: /2023/04/08/easter-show-value.html
  post: 2023-04-08-easter-show-value
- from: /2021/08/12/summarise-my-hackathon.html
